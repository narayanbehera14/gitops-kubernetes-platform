{"name": "CI", "on": {"push": {"branches": ["main"]}, "pull_request": {"branches": ["main"]}}, "permissions": {"contents": "read", "packages": "write"}, "jobs": {"test": {"runs-on": "ubuntu-latest", "steps": [{"name": "Checkout repository", "uses": "actions/checkout@v4"}, {"name": "Setup Node.js", "uses": "actions/setup-node@v4", "with": {"node-version": 20, "cache": "npm", "cache-dependency-path": "app/package-lock.json"}}, {"name": "Install dependencies", "working-directory": "app", "run": "npm ci"}, {"name": "Test application", "working-directory": "app", "run": "node server.js &\nsleep 3\ncurl --fail http://localhost:3000/health"}, {"name": "Log in to GHCR", "uses": "docker/login-action@v3", "with": {"registry": "ghcr.io", "username": "${{ github.actor }}", "password": "${{ secrets.GITHUB_TOKEN }}"}}, {"name": "Build and push Docker image", "uses": "docker/build-push-action@v6", "with": {"context": "./app", "push": true, "tags": "ghcr.io/narayanbehera14/gitops-demo-app:${{ github.sha }}"}}]}}}
