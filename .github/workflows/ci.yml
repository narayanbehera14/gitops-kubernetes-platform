{"name": "CI", "on": {"push": {"branches": ["main"]}, "pull_request": {"branches": ["main"]}}, "permissions": {"contents": "write", "packages": "write"}, "jobs": {"test": {"runs-on": "ubuntu-latest", "steps": [{"name": "Checkout repository", "uses": "actions/checkout@v4"}, {"name": "Setup Node.js", "uses": "actions/setup-node@v4", "with": {"node-version": 20, "cache": "npm", "cache-dependency-path": "app/package-lock.json"}}, {"name": "Install dependencies", "working-directory": "app", "run": "npm ci"}, {"name": "Test application", "working-directory": "app", "run": "node server.js &\nsleep 3\ncurl --fail http://localhost:3000/health"}, {"name": "Log in to GHCR", "uses": "docker/login-action@v3", "with": {"registry": "ghcr.io", "username": "${{ github.actor }}", "password": "${{ secrets.GITHUB_TOKEN }}"}}, {"name": "Build and push Docker image", "uses": "docker/build-push-action@v6", "with": {"context": "./app", "push": true, "tags": "ghcr.io/narayanbehera14/gitops-demo-app:${{ github.sha }}"}}, {"name": "Update Kubernetes image", "if": "github.event_name == 'push' && github.ref == 'refs/heads/main'", "run": "python3 -c 'from pathlib import Path; p=Path(\"k8s/deployment.yaml\"); x=p.read_text(); old=\"ghcr.io/narayanbehera14/gitops-demo-app:\"; lines=x.splitlines(); lines=[(line.split(old)[0]+old+\"${{ github.sha }}\" if old in line else line) for line in lines]; p.write_text(\"\\n\".join(lines)+\"\\n\")'"}, {"name": "Commit and push GitOps manifest", "if": "github.event_name == 'push' && github.ref == 'refs/heads/main'", "run": "git config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add k8s/deployment.yaml\ngit diff --cached --quiet || git commit -m \"Update image to ${{ github.sha }} [skip ci]\"\ngit push"}]}}}
